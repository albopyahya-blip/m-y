<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Love</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4d6d;
            --accent: #c92f78;
            --bg-grad: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            --glass: rgba(255, 255, 255, 0.42);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(ellipse at 12% 16%, rgba(255,255,255,.6), transparent 34%),
                        radial-gradient(ellipse at 88% 84%, rgba(255,255,255,.38), transparent 30%), var(--bg-grad);
            overflow-x: hidden; overflow-y: auto; padding: 24px;
        }
        .card {
            width: 100%; max-width: 440px;
            background: var(--glass); backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            padding: clamp(28px, 7vw, 42px) clamp(20px, 6vw, 32px);
            border-radius: 32px;
            box-shadow: 0 24px 60px rgba(174, 54, 100, .18), inset 0 1px 0 rgba(255,255,255,.7);
            border: 1px solid rgba(255, 255, 255, .72);
            text-align: center; z-index: 10;
        }
        #buttons-list { width: 100%; }
        .button-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
        .square-button {
            aspect-ratio: 1; min-width: 0; display: flex; align-items: center; justify-content: center;
            padding: 8px; border: 1px solid rgba(214,51,132,.22); border-radius: 18px;
            background: linear-gradient(145deg, rgba(255,255,255,.98), rgba(255,239,245,.92));
            box-shadow: 0 7px 16px rgba(174,54,100,.09), inset 0 1px 0 #fff;
            color: var(--accent); font-size: clamp(11px, 3vw, 14px); font-weight: 600;
            line-height: 1.25; text-align: center; text-decoration: none; overflow-wrap: anywhere;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        }
        .square-button:hover, .square-button:focus-visible {
            transform: translateY(-3px); border-color: rgba(214,51,132,.55);
            box-shadow: 0 12px 22px rgba(174,54,100,.16); outline: none;
        }
        .square-button:active { transform: scale(.97); }
        #fab-container { position: fixed; bottom: max(28px, env(safe-area-inset-bottom)); right: max(28px, env(safe-area-inset-right)); z-index: 1000; }
        .fab-btn {
            width: 62px; height: 62px; background: rgba(255,255,255,.94); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 28px; box-shadow: 0 12px 30px rgba(153,38,83,.2);
            cursor: pointer; border: 2px solid rgba(255,77,109,.75); padding: 0;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .fab-btn:hover { transform: translateY(-3px); box-shadow: 0 16px 34px rgba(153,38,83,.25); }
        .fab-btn:focus-visible { outline: 3px solid rgba(214,51,132,.3); outline-offset: 4px; }
        .heart {
            position: fixed; bottom: -50px; pointer-events: none;
            animation: floatUp linear forwards; z-index: 1;
        }
        @keyframes floatUp { to { transform: translateY(-115vh) rotate(360deg); opacity: 0; } }
        @media (max-width: 480px) {
            body { padding: 18px; }
            .card { max-width: 400px; padding: 28px 22px; border-radius: 28px; }
            .button-grid { gap: 9px; }
            .square-button { border-radius: 15px; padding: 6px; }
            #fab-container { right: 18px; bottom: max(18px, env(safe-area-inset-bottom)); }
            .fab-btn { width: 56px; height: 56px; font-size: 25px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>

    <script>
        function createHeart() {
            const h = document.createElement('div');
            h.className = 'heart';
            h.textContent = ['❤️','💖','🌸','✨','💕'][Math.floor(Math.random()*5)];
            h.style.left = Math.random() * 100 + "vw";
            h.style.fontSize = (20 + Math.random()*25) + "px";
            h.style.animationDuration = (4 + Math.random()*3) + "s";
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 7000);
        }
        setInterval(createHeart, 450);
    </script>
