            c: `البيت الذي يحقق الأمنيات

فضل يحيى ماسك المفتاح الجديد بإيده وهو بيقرأ الكلام المكتوب عليه أكتر من مرة وكان مستغرب إزاي بيت يحقق الأمنيات لكنه مش هينفع يتمنى فيه حاجة لنفسه

كان عنده ألف سؤال بيلفوا في دماغه لكن الحاجة الوحيدة اللي كان متأكد منها إن كل مفتاح من المفاتيح دي كان بيعلمه حاجة جديدة عن الحب وعن السعادة وعن معنى إن يكون عندك شخص واحد قادر يخلي كل حاجة حواليك أجمل و احلا

أول ما مسك المفتاح بدأ ينور بنفس النور الذهبي اللي شافه في المرة اللي فاتت وبدأت الدنيا كلها تختفي من حواليه مرة تانية ولما فتح عينه لقى نفسه واقف هو وملك قدام بيت عمره ما شاف زيه قبل كده

كان بيت كبير جدًا لكنه مكنش شبه أي بيت في الدنيا كانت الحيطان بتاعته كلها بيضا لكنها بتنور بألوان مختلفة كل شوية والشبابيك بتاعته كانت من الزجاج لكن كان واضح إن اللي جواها مش ثابت كأن كل أوضة فيها بتحكي حكاية مختلفة عن اللي جنبها

وفوق باب البيت كان مكتوب جملة صغيرة

أهلًا بكم في البيت الذي يحقق الأمنيات

تقدر تحقق أي أمنية في الدنيا بشرط واحد فقط

نظر يحيى وملك لبعض وابتسموا وكملوا قراءة اللي مكتوب

ممنوع أن تتمنى شيئًا لنفسك

لو كانت أمنيتك لشخص آخر فقط ستتحقق

لو كانت لنفسك فلن يحدث شيء

ابتسم يحيى وقال لملك أعتقد إن المفتاح ده معمول علشانك

فضحكت وقالتله وأنا حاسة إنه معمول علشانك أنت

وأول ما دخلوا البيت سمعوا صوت هادي بيقول

معاكم ثلاث أمنيات فقط

كل أمنية هتتحقق في الحال

لكن تذكروا جيدًا إنكم لن تستطيعوا استخدامها لأنفسكم

وفجأة ظهر قدامهم ساعة رملية كبيرة جدًا وبدأ الرمل اللي فيها ينزل ببطء

قال يحيى لملك بسرعة يلا اتمني أي حاجة نفسك فيها

بصتله وقالتله لا أنت الأول

ضحك وقالها هو إحنا هنفضل كده طول الوقت

قالتله آه

فضلوا واقفين خمس دقايق كاملة وكل واحد فيهم مصمم إن التاني هو اللي يتمنى الأول

لحد ما ملك قالتله طب خلاص أنا هتمنى

ابتسم وقالها أخيرًا

قالت وهي باصة في عينيه أتمنى إن يحيى يفضل أسعد إنسان في الدنيا مهما كانت الأيام صعبة عليه

وفجأة البيت كله بدأ ينور بشكل جميل جدًا وظهرت وردة بيضا صغيرة في إيد يحيى

واستغرب وقالها هو ده معنى إن الأمنية اتحققت

فظهر الكلام على الحيطة اللي قدامهم

الأمنيات الحقيقية لا تتحقق في لحظة لكنها تبدأ في لحظة

ابتسم يحيى وهو باصص للوردة وقال في نفسه إن يمكن لأول مرة يعرف إن أجمل حاجة في الحب إن الشخص اللي قدامك يتمنى سعادتك قبل سعادته

وفضل يبص لملك شوية وقالها تعرفي إن دي أغلى هدية أخدتها النهاردة

قالتله ليه

قالها علشان أول أمنية ليكي في مدينة الأمنيات مكنتش ليكي أنتى

ابتسمت من غير ما ترد لأنها أصلًا كانت شايفة إن دي أكتر حاجة طبيعية في الدنيا

فضلوا يتمشوا في البيت لحد ما دخلوا أوضة كبيرة جدًا كانت كلها مرايات لكن الغريب إن كل مراية كانت بتوريهم حاجة مختلفة

في مراية كانت بتوريهم وهم بيضحكوا وفي واحدة تانية كانوا ماشيين فيها تحت المطر وفي واحدة كانوا قاعدين بيتكلموا بالساعات من غير ما يزهقوا

استغرب يحيى جدًا وسأل الصوت اللي في البيت إيه المرايات دي

فرد عليه

هذه ليست صورًا من الماضي

هذه ذكريات لم تعيشوها بعد

وفجأة وقف قدام مراية معينة واتصدم من اللي شافه

كان شايف نفسه قاعد جنب ملك وهي بتضحك بنفس الطريقة اللي بيحبها جدًا وكان هو باصلها بنفس النظرة اللي بيبصلها بيها كل يوم

لكن الغريب إنه مكنش قادر يشوف المكان اللي قاعدين فيه

فسأل الصوت ده إمتى

فرد عليه

بعض الذكريات أجمل لما تعيشها بنفسك

وفجأة ظهر قدامهم صندوق صغير جدًا وكان مكتوب عليه

الأمنية الأخيرة

قالت ملك ليحيى افتحه أنت المرة دي

فتح الصندوق ولقي جواه ورقة صغيرة جدًا مكتوب فيها

تقدر تستخدم الأمنية الأخيرة لشخص واحد فقط

بص يحيى لملك وابتسم وقالها أنا عرفت أمنيتي من قبل ما أقرأ الورقة أصلًا

قالتله إيه هي

قالها إني أفضل كل يوم أشوف الابتسامة اللي على وشك دي مهما عدى علينا وقت ومهما الدنيا اتغيرت

وفجأة اختفت الساعة الرملية وبدأ البيت كله ينور أكتر من الأول وظهر على الحيطة جملة صغيرة جدًا

لقد نجحتم في الاختبار

الحب الحقيقي هو أن تكون سعادتك المفضلة هي سعادة الشخص الذي تحبه

وبدأ البيت كله يختفي بالتدريج ولأول مرة قبل ما يرجعوا ظهر قدام يحيى وملك باب صغير جدًا مقفول بمفتاح ذهبي

وكان مكتوب عليه

ممنوع فتح هذا الباب الآن

قال يحيى باستغراب هو ده إيه

فظهرت جملة جديدة تحته

هذا الباب سيفتح عندما تصبح إحدى أمنياتكم حقيقة في يوم من الأيام

ولأول مرة بدأ يحيى يفكر إن يمكن أجمل المفاتيح لسه حتى مظهرتش

وعندما عاد للصندوق الخشبي مرة أخرى وجد مفتاحًا جديدًا مكتوبًا عليه

المكتبة التي تخبئ ألف ضحكة لم تضحكوها بعد

ومكتوب تحته جملة صغيرة جدًا

بعض الضحكات تنتظركم منذ زمن طويل

            c: `المكتبة التي تخبئ ألف ضحكة لم تضحكوها بعد

كان يحيى كل ما يفتح مفتاح جديد بيكتشف إن اللي مستنيه أجمل بكتير من اللي كان متخيله لكن الغريبة إن كل حكاية كانت بتسيب جواه سؤال جديد

هو إزاي فيه أماكن كانت مستنياه ومستنية ملك من قبل حتى ما يعرفوا إنها موجودة

فضل يبص للمفتاح الجديد شوية وهو مبتسم وقال لملك أنا بدأت أحس إن المفاتيح دي كانت مستنيانا من زمان

ضحكت وقالتله وأنا بدأت أحس إن الصندوق ده عارف عننا أكتر ما إحنا عارفين عن نفسنا

وأول ما مسكوا المفتاح بدأ ينور بنفس النور الذهبي الجميل اللي بقوا متعودين عليه ولما فتحوا عيونهم لقوا نفسهم واقفين قدام مكتبة ضخمة جدًا

لكن دي مكنتش مكتبة عادية

مكانش فيها آلاف الكتب وبس لكن كان فيها ملايين الكتب وكانت طويلة جدًا لدرجة إنهم مكنوش شايفين آخرها وكل كتاب فيها كان بينور بلون مختلف عن التاني وكأن كل كتاب جواه حكاية مختلفة

وفوق باب المكتبة كان مكتوب

أهلًا بكم في مكتبة الضحكات التي لم تولد بعد

كل ضحكة ستقرأونها هنا تنتظركم في المستقبل

استغربت ملك وقالت وهي بتضحك يعني إحنا جايين نقرأ ضحكات

فرد الصوت اللي بيستقبلهم في كل حكاية

قالتله طب وإيه النكتة

وكان كل ما يفتحوا صفحة يلاقوا ضحكة جديدة مستنياهم

وفضلوا يضحكوا على كل الصفحات الصغيرة اللي بتحكي أيام عادية جدًا لكنها كانت أجمل الأيام بالنسبة ليهم

كان كتاب لونه أبيض ومكتوب عليه

الضحكات التي ستتذكرونها إلى الأبد

فتحته بهدوء ولقت أول صفحة مكتوب فيها

وقبل ما يخرجوا من المكتبة لمح جملة صغيرة جدًا مكتوبة على آخر رف فيها

لحد ما لمح يحيى نجمة مختلفة عن كل اللي حواليها كانت بتنور أكتر من الباقي لكنه مكانش مكتوب عليها أي حاجة

فسأل الصوت اللي بيرافقهم في كل الحكايات عنها

قاله وليه النجمة دي مفيش عليها اسم

فرد عليه

لأنها لم تحدث بعد

قاله يعني إيه

قال

إنها أجمل ذكرى ستعيشونها معًا لكنها لم تأت بعد لذلك لم نكتب اسمها

فضل يحيى باصلها وقت طويل جدًا وقال في نفسه يمكن أجمل الأيام فعلًا هي اللي لسه مستنيانا

وقبل ما المدينة تختفي بلحظات ظهرت جملة أخيرة في السماء

بعض الناس يتمنون ان يصبحو مثلكما

وبدأ الزمن يرجع يتحرك من جديد واختفت المدينة بالتدريج وعاد الصندوق الخشبي مرة أخرى

لكن المرة دي كان المفتاح الجديد لونه وردي فاتح ومكتوب عليه

الغرفة التي تحتوي على كل الرسائل التي لم تكتبوها بعد

وكان تحته جملة صغيرة جدًا

هناك كلمات كثيرة لم تقال بعد لكنها تنتظركما منذ زمن طويل

            { t: "الفصل 5", p: "5073", c: `الغرفة التي تحتوي على كل الرسائل التي لم تكتبوها بعد

فضل يحيى ماسك المفتاح الجديد وقت أطول من أي مفتاح شافه قبل كده يمكن علشان أول مرة يحس إن المفتاح ده شبهه شوية وشبه ملك أكتر لأن أكتر حاجة كانوا بيحبوها هي الكلام اللي بيطلع من القلب من غير ترتيب ومن غير تفكير كتير

كان دايمًا بيقول إن الكلمات الغالية مبتبقاش في الكتب الكبيرة لكنها بتبقى في رسالة صغيرة اتبعتت في نص الليل علشان تقول لشخص واحد بس إنك كنت محتاج تطمن عليه أو إن يومك مكانش هيكمل من غير ما تسمع صوته

بص للمفتاح وهو مبتسم وقال لملك تعرفي أنا حاسس إن الفصل ده هيخليني أعيط

ضحكت وقالتله وأخيرًا اعترفت إنك بتعيط

قالها لا أنا بس إنسان حساس جدًا

قالتله طبعًا طبعًا

وأول ما مسكوا المفتاح بدأ النور الذهبي يظهر حواليهم من جديد لكن المرة دي كان النور أهدى من كل مرة وكأنه نور خارج من ألف نجمة صغيرة حوالين المفتاح

ولما فتحوا عيونهم لقوا نفسهم واقفين قدام باب أبيض طويل جدًا وكان شكله بسيط بشكل غريب لكنه جميل جدًا

وعلى الباب كانت مكتوبة جملة صغيرة

أهلًا بكم في الغرفة التي تحتوي على كل الرسائل التي لم تكتبوها بعد

هنا تحفظ الكلمات التي شعرتم بها ولم تقولوها والرسائل التي كنتم ستكتبونها لو امتلكتم ألف عمر إضافي

استغربت ملك وقالتله يعني إحنا هنقرأ كلام عمرنا ما كتبناه

فظهر سطر جديد على الباب

بل ستقرأون ما كان يريد قلبكما أن يقوله دائمًا

وأول ما دخلوا الغرفة اتفاجئوا إنها كانت أكبر بكتير مما كانوا متخيلين كانت مليانة بملايين الرسائل الصغيرة وكل رسالة كانت بتنور بلون مختلف عن اللي جنبها

كان فيه رسائل لونها ذهبي ورسائل لونها أبيض ورسائل لونها أزرق فاتح ورسائل لونها وردي جميل جدًا

وفي آخر الغرفة كانت فيه مكتبة طويلة جدًا مكتوب عليها

رسائل لم يحن موعدها بعد

وفي الناحية التانية مكتوب

رسائل شعرتم بها ونسيتم أن تقولوها

وأول ما قربوا من المكتبة الأولى طارت رسالة صغيرة جدًا ووقفت قدام يحيى

فتحها وهو مبتسم فلقى مكتوب فيها

في يوم من الأيام هتبص لملك وهي بتتكلم في موضوع أنت مش فاهم منه أي حاجة لكنك هتفضل مبتسم طول الوقت لأنك هتكتشف إن صوتها كان دايمًا من أكتر الأصوات اللي بتحب تسمعها حتى لو مكانتش بتتكلم عنك

ابتسم وقال لملك أنا حاسس إن الرسائل دي بتفضحنا شوية

فضحكت وقالتله لا دي لسه في الأول

وطارت رسالة تانية ناحية ملك ولما فتحتها لقت مكتوب فيها

في يوم من الأيام هتكوني زعلانة جدًا ومش هتتكلمي مع أي حد لكن أول ما هيقولك أنا موجود هتكتشفي إن الجملة دي كانت دايمًا كفاية إنها تطمن قلبك كله

فضلت باصة للرسالة شوية وبعدين ابتسمت من غير ما تقول حاجة

وكان كل ما يفتحوا رسالة يكتشفوا حاجة جديدة عن نفسهم وعن حبهم لبعض

وفي وسط الغرفة لقوا ساعة رملية صغيرة جدًا لكن الغريب إنها كانت مليانة بأوراق صغيرة بدل الرمل

سأل يحيى الصوت اللي معاهم عنها فقاله

هذه الساعة تحتوي على كل الرسائل التي كنتم على وشك كتابتها ثم مسحتموها قبل أن ترسلوها

استغرب جدًا وقال يعني إيه

فرد عليه

هناك ألف مرة كتبت فيها اشتقتلك ثم مسحتها وهناك ألف مرة كتبت فيها بحبك ثم قلت سأقولها غدًا وهناك رسائل كثيرة لم تصل لكنها كانت حقيقية بنفس قدر الرسائل التي وصلت

وفجأة ظهرت رسالة صغيرة جدًا في إيد ملك مكتوب عليها

رسالة من يحيى لم يرسلها بعد

بصتله بسرعة وقالتله أفتحها

قالها وأنا معرفش فيها إيه أصلًا

فتحتها وبدأت تقرأ

لو كان مسموحلي أعيش نفس اليوم ألف مرة فأنا مش هغير فيه أي حاجة غير إني هختار إني أقعد جنبك وقت أطول شوية ولو خيروني بين كل الأحلام اللي في الدنيا وبين يوم عادي جدًا معاكي هختار اليوم العادي من غير حتى ما أفكر لأن وجودك خلا كلمة عادي تبقى أجمل كلمة ممكن أعيشها

فضلت ساكتة شوية وبعدين قالتله الرسالة دي حلوة أوي

ضحك وقالها وأنا أول مرة أعرف إني كتبتها أصلًا

وفجأة ظهرت رسالة صغيرة في إيد يحيى مكتوب عليها

رسالة من ملك لم ترسل بعد

فتحها وبدأ يقرأ

في يوم من الأيام هتكتشف إنك كنت أجمل صدفة حصلتلي وإن مهما كتبت ومهما قلت عمري ما هوصف قد إيه أنا ممتنة إن الدنيا اختارت إنها تجمعنا ببعض وإن أكتر مكان بحسه أمان بالنسبة ليا مكانش مكان أصلًا لكنه كان جنب شخص واحد وبس

فضل باصص للرسالة وقت طويل جدًا من غير ما يتكلم

ويمكن لأول مرة في كل الحكايات اللي عاشوها كان ساكت لأنه مكانش لاقي كلام يرد بيه

وكملوا يتمشوا في الغرفة لحد ما وصلوا لآخر باب فيها وكان عليه قفل ذهبي صغير جدًا

سأل يحيى الصوت اللي معاهم الباب ده فيه إيه

فرد عليه

هذا الباب يحتوي على آخر رسالة ستكتبانها لبعض

اتخضوا هما الاتنين في نفس اللحظة

فكمل الصوت كلامه بسرعة

لكن لا تقلقا لن تستطيعا فتحه اليوم

استغربت ملك وسألته ليه

فقال

لأن أجمل الرسائل هي التي لم تكتب بعد

ابتسم يحيى وقال يعني الرسالة دي لسه بعيدة

فرد عليه الصوت

بل على العكس

أنتم تكتبونها الآن

قال باستغراب إزاي

فرد عليه

كل ضحكة وكل كلمة حلوة وكل لحظة جميلة تعيشونها معًا تكتب سطرًا جديدًا فيها لذلك لا أحد يعلم متى ستنتهي لأنها تكتب كل يوم

وفي نهاية الغرفة لقوا صندوق صغير جدًا مكتوب عليه

أكبر سر في هذا المكان

فتحوه بهدوء فلقوا جواه ورقة واحدة بس مكتوب فيها

بعض الناس يرسلون مئات الرسائل في حياتهم لكن أجمل رسالة يمكن أن ترسلها لشخص هي أن تجعله يشعر كل يوم أنه محبوب

وقتها بص يحيى لملك وابتسم وقالها تعرفي أنا حاسس إن الفصل ده مكنش عن الرسائل أصلًا

قالتله أمال كان عن إيه

قالها كان عن إن الحب الحقيقي عمره ما كان مجرد كلام بيتكتب لكنه كان دايمًا بيتشاف في التصرفات الصغيرة اللي بنعملها لبعض كل يوم

ولأول مرة ظهرت كل الرسائل اللي في الغرفة بتنور مع بعض وكأنها ملايين النجوم الصغيرة وظهر كلام كبير جدًا في سقف الغرفة مكتوب فيه

أجمل الرسائل هي التي تجعل أصحابها لا يحتاجون إلى الكلمات كي يفهموا بعضها

وبدأت الغرفة تختفي بالتدريج وعاد الصندوق الخشبي مرة أخرى لكنه هذه المرة كان أثقل من كل مرة وكأنه يحمل حكاية مختلفة تمامًا

وكان المفتاح الجديد بلون السماء وقت الغروب ومكتوب عليه

المدينة التي لا يعرف أهلها معنى الحزن

وكان تحته جملة صغيرة جدًا

هناك مكان في هذا العالم لم يبك فيه أحد قط فهل ستستطيعان أن تعلما سر سعادته

كان يحيى كل ما يفتح مفتاح جديد بيحس إنه بيتعلم حاجة جديدة عن نفسه وعن ملك وعن الحب اللي بينهم لكنه لأول مرة كان حاسس بفضول أكبر من كل مرة

إزاي فيه مدينة كاملة عمرها ما عرفت معنى الحزن

وإزاي ممكن إنسان يعيش عمره كله من غير ما يبكي مرة واحدة

فضل يبص للمفتاح الجديد شوية وقال لملك تعرفي أنا لو المدينة دي موجودة فعلًا فممكن أعيش فيها العمر كله

ضحكت وقالتله وأنا عندي اقتراح أحلى

قالها إيه

قالتله نسرقها ونروح بيها بيتنا

ضحك وقالها أهو أنا كنت عارف إن المفاتيح دي في يوم من الأيام هتخلينا ندخل السجن

وأول ما مسكوا المفتاح بدأ النور الذهبي يظهر حواليهم للمرة السادسة لكن المرة دي كان مختلف عن كل مرة كان شكله عامل زي ملايين النجوم الصغيرة اللي بتلف حواليهم وكأن المدينة نفسها فرحانة إنها أخيرًا هتشوفهم

ولما فتحوا عيونهم لقوا نفسهم واقفين قدام بوابة ضخمة جدًا لونها أبيض وفضي وكانت جميلة بشكل يخليك تفضل باصلها وقت طويل

وعلى البوابة كان مكتوب

أهلًا بكم في المدينة التي لا يعرف أهلها معنى الحزن

هناك قانون واحد فقط في هذه المدينة

ممنوع أن تكون سعيدًا وحدك

استغرب يحيى وقال يعني إيه

فظهر سطر جديد تحت الكلام

السعادة التي لا تشاركها مع من تحب لا تعتبر سعادة كاملة

ابتسم وبص لملك وقالها أنا بدأت أحب قوانين المدن دي جدًا

وأول ما دخلوا المدينة اتفاجئوا إن كل الناس اللي فيها مبتسمة لكن مش الابتسامة اللي بتكون على الوش وبس لا كانت ابتسامة تشبه الراحة اللي بتحس بيها لما ترجع البيت بعد يوم طويل

كانت مدينة بسيطة جدًا مفيهاش قصور ولا أماكن مبهرة لكن كان فيها حاجة جميلة جدًا مش قادرين يوصفوها

كانت مليانة دفا

فضلوا يتمشوا فيها شوية لحد ما لقوا طفل صغير ماسك وردة وواقف مستني حد

سألته ملك أنت مستني مين

ابتسم وقالها مستني أول شخص يعدي من هنا علشان أديهاله

قالتله تعرفه

هز رأسه وقالها لا

استغربت وسألته طب وإشمعنى

قالها أصل في المدينة دي كل يوم بنفرح حد من غير ما نعرفه

فضل يحيى باصص للطفل شوية وابتسم وقال في نفسه يمكن السعادة فعلًا أبسط بكتير مما إحنا فاكرين

وكملوا طريقهم لحد ما لقوا مطعم صغير جدًا لكن مكنش فيه أسعار مكتوبة على أي حاجة

سأل يحيى الراجل اللي واقف هناك هو ليه مفيش أسعار

ابتسم الراجل وقاله لأن اللي بياكل هنا بيدفع تمن أكلة الشخص اللي بعده

استغرب جدًا وقال يعني إيه

قاله يعني أنت مش بتدفع تمن سعادتك أنت بتدفع تمن سعادة حد تاني

وكان كل شارع في المدينة بيعلمهم حاجة جديدة

في شارع الناس كلها كانت بتكتب رسائل حلوة لبعض من غير ما يمضوا أسماءهم

وفي شارع تاني كانوا بيسيبوا الهدايا الصغيرة على أبواب البيوت من غير ما يعرفوا أصحابها

وفي شارع تالت كان فيه صندوق كبير جدًا مكتوب عليه

ضع هنا أكثر شيء جعلك سعيدًا اليوم

استغربت ملك وقالتله هو إزاي حد يحط سعادته في صندوق

فرد عليها الصوت اللي معاهم

في آخر اليوم يفتح الصندوق وتتوزع كل الذكريات الجميلة على أهل المدينة حتى لا ينام أحد وهو حزين

وفجأة ظهر قدامهم باب صغير جدًا مكتوب عليه

غرفة الأحزان

استغربوا جدًا لأن المدينة أصلًا لا تعرف معنى الحزن

فتحوا الباب ودخلوا لقوا الغرفة فاضية تمامًا إلا من مرآة واحدة بس

اقترب منها يحيى لكنه متفاجئش إنه شاف نفسه فيها

اللي فاجأه إنه كان شايف نفسه في كل مرة كان زعلان فيها وملك كانت السبب في ابتسامته بعدها

ولما بصت ملك في المرآة شافت كل مرة كانت محتاجة حد يطمنها وكان يحيى هو أول شخص جه في بالها

فظهر كلام صغير جدًا تحت المرآة مكتوب فيه

أهل هذه المدينة لا يعيشون بلا أحزان

لكنهم لا يعيشونها وحدهم

سأل يحيى الصوت اللي معاهم وقاله يعني المدينة دي بتعرف معنى الحزن

فرد عليه

بل تعرفه جيدًا لكنها تعلمت أن السعادة الحقيقية ليست أن لا تحزن أبدًا لكنها أن تجد الشخص الذي يجعل حزنك أخف

وفجأة ظهرت جملة جديدة على الحائط

لا يوجد إنسان في هذا العالم لم يبك يومًا لكن يوجد أشخاص يجعلوننا نبتسم بعد أن نبكي

وفي تلك اللحظة سكت يحيى شوية وبص لملك وافتكر كل مرة كانت سبب في إنه يبتسم من غير ما تقصد وكل مرة كانت جنبه فيها حتى لو كانت مجرد كلمة بسيطة منها

ولأول مرة حس إن المدينة دي مش أجمل مدينة دخلوها

لكنها أكتر مدينة شبههم

وقبل ما يخرجوا منها لقوا شجرة كبيرة جدًا في نص المدينة لكن الغريب إن مكنش عليها ثمار ولا ورد

كان عليها صور صغيرة جدًا

اقتربوا منها فلقوا إن كل صورة كانت لشخصين مبتسمين

سأل يحيى عنها فقاله الصوت

هذه شجرة الأشخاص الذين وجدوا وطنهم في شخص آخر

ابتسم وقاله وهل يمكن أن تضاف صورتنا إليها يومًا ما

فرد عليه

لقد أضيفت منذ اللحظة التي فضلتما فيها سعادة بعضكما على سعادة نفسيكما

وبدأت الشجرة تنور بالتدريج وظهرت صورتهم الصغيرة بين آلاف الصور الموجودة عليها

ولأول مرة في كل الحكايات اللي عاشوها حس يحيى إن أجمل مكان ممكن يروحه الإنسان هو المكان اللي بيلاقي فيه نفسه مرتاحة

وقبل ما تختفي المدينة ظهرت آخر جملة في السماء وكانت مختلفة عن كل الجمل اللي شافوها قبل كده

السعادة ليست مدينة تسكنها لكنها شخص تعود إليه بعد يوم طويل فتشعر أنك عدت إلى بيتك

وبدأت المدينة كلها تختفي بالتدريج وعاد الصندوق الخشبي مرة أخرى لكن هذه المرة كان المفتاح الجديد أسود اللون وفي منتصفه نجمة ذهبية صغيرة

وكان مكتوب عليه

الليلة التي سقطت فيها نجمة من السماء

وكان تحته جملة صغيرة جدًا

في هذه الليلة ستتحقق أمنية واحدة فقط لكن عليكما أن تختاراها معًا

وفوق الطاولة كانت مكتوبة جملة صغيرة

لن يسمح لكما بالكذب هنا

ابتسم يحيى وقالها والله أنا حاسس إن كل مكان بنروحه بيبقى أخطر من اللي قبله

وفجأة سمعوا الصوت اللي بقى مألوف بالنسبالهم وهو بيقول

أهلًا بكما

اليوم لن تجيبا على أي سؤال بالكلمات

ستجيب قلوبكما فقط

وظهر السؤال الأول

وأثناء كلامهم ظهر صندوق صغير جدًا فوق الطاولة الموجودة في آخر الغرفة

ولما فتحوه لقوا جواه جوابين

واحد باسم يحيى

وواحد باسم ملك

لكن كان مكتوب عليهم

يفتحان بعد خمسين مفتاحًا من الآن

ضحك يحيى وقال والله شكل الصندوق ده ناوي يكمل معانا العمر كله

فرد عليه الصوت

وهل أجمل الحكايات تكتب في بضعة فصول فقط

أحيانًا تحتاج الحكاية الجميلة إلى ألف فصل حتى تصبح أجمل

ولأول مرة من ساعة ما بدأت رحلتهم كلها حس يحيى إنه مش عايز يعرف اللي جوا الجوابين دلوقتي

يمكن علشان بدأ يفهم إن أجمل حاجة في الرحلة مش الوصول لكن الطريق نفسه

وقبل ما تختفي الغرفة ظهرت آخر نجمة في المكان كله وكانت أكبر من كل النجوم اللي حواليها لكنها مكانش مكتوب عليها أي كلمة

سأل يحيى عنها فقال الصوت

هذه النجمة تمثل أجمل كلمة حب ستقولانها لبعض يومًا ما لكنها لم تكتب بعد

قال باستغراب يعني بعد كل اللي اتقال لسه فيه كلام أحلى

فرد عليه

الحب الحقيقي لا يصل إلى أجمل نسخة منه بل يستمر في النمو كل يوم

ثم أكمل كلامه بهدوء

وتذكر يا يحيى أن أجمل أنا أحبك لن تكون تلك التي قلتها بالأمس بل تلك التي ستقولها غدًا بنفس الحب وربما أكثر قليلًا

وتذكري يا ملك أن أجمل ما في الحب ليس أن تسمعي كلمة بحبك ألف مرة بل أن تشعري بها ألف مرة كل يوم

وبدأت الغرفة كلها تختفي بالتدريج لكن قبل ما ترجعوا ظهر كلام أخير في السماء جعلهم يبتسموا طويلًا

إذا سألكما أحد يومًا لماذا أحببتما بعضكما البعض فلا تحاولا الإجابة لأن أجمل قصص الحب هي تلك التي تعجز الكلمات كلها عن وصفها

وبدأ المكان يختفي وعاد الصندوق الخشبي مرة أخرى لكن هذه المرة كان المفتاح الجديد بينور بشكل مختلف عن كل المفاتيح السابقة

كان مصنوعًا من ضوء الشروق وضوء الغروب معًا وكأن بدايته ونهايته اجتمعوا في مفتاح واحد

وكان مكتوب عليه

اليوم الذي أدركتما فيه أنكما كنتما أمنية بعضكما منذ البداية

وكان تحته جملة صغيرة جدًا

            { t: "الفصل 14", p: "5720", c: `اليوم الذي أدركتما فيه أنكما كنتما أمنية بعضكما منذ البداية

فضل يحيى باصص للمفتاح الجديد وقت أطول من أي مرة فاتت يمكن علشان لأول مرة يحس إن الجملة المكتوبة عليه مش بتتكلم عن المستقبل لكنها بتتكلم عن كل اللي فات

اليوم الذي أدركتما فيه أنكما كنتما أمنية بعضكما منذ البداية

قرأ الجملة الصغيرة اللي تحته أكتر من مرة

أحيانًا نبحث طويلًا عن أحلامنا دون أن ننتبه أننا أصبحنا حلم شخص آخر منذ زمن بعيد

ابتسم ابتسامة صغيرة وبص لملك وقالها تفتكري لو كنا عرفنا بعض بدري عن كده كان زماننا عاملين إيه

فكرت شوية وبعدين قالتله أعتقد إننا كنا هنوصل لبعض برضه حتى لو الدنيا كانت أصعب من كده بمليون مرة

قالها وإنتي متأكدة من ده

قالتله تعرف أنا طول الرحلة دي بقيت مؤمنة بحاجة واحدة بس

قالها إيه

قالتله إن فيه حاجات كتير في الدنيا ممكن تتغير لكن بعض الأشخاص مكتوبلهم يقابلوا بعض مهما الدنيا أخدتهم يمين أو شمال

ابتسم وهو بيسمع كلامها وحس لأول مرة إن فيه جمل بسيطة جدًا لكنها تستحق إنها تتكتب في ألف كتاب

وأول ما مسكوا المفتاح بدأ المكان كله ينور حواليهم لكن المرة دي النور مكانش شبه أي نور شافوه قبل كده

كان عامل زي شروق الشمس وغروبها في نفس اللحظة وكأن المكان كله بيقولهم إن النهايات والبدايات مش بعاد عن بعض زي ما إحنا فاكرين

ولما فتحوا عيونهم لقوا نفسهم واقفين قدام ساعة ضخمة جدًا لكن الغريب إنها مكانتش بتتحرك لقدام ولا لورا لكنها كانت واقفة عند كل اللحظات الجميلة اللي عاشوها مع بعض

وعلى الساعة كانت مكتوبة جملة صغيرة جدًا

كل شيء كان يأخذكما لبعضكما حتى قبل أن تعرفا ذلك

بدأوا يتمشوا حواليها بهدوء لحد ما ظهر أول باب وكان مكتوب عليه

قبل اللقاء الأول

استغرب يحيى جدًا وقال هو إحنا هنشوف إيه هنا

فرد عليهم الصوت اللي بقوا يعرفوه من أول الرحلة

ستشاهدان كل الطرق التي كانت تأخذكما لبعضكما دون أن تنتبها

وأول ما فتحوا الباب لقوا نفسهم بيشوفوا أيام عادية جدًا من حياتهم قبل ما يعرفوا بعض

كان يحيى بيضحك مع أصحابه في يوم عادي جدًا وملك بتتكلم مع أصحابها في يوم تاني عادي جدًا

مكنش فيه أي شيء مميز بيحصل لكن كل ما يعدي يوم كانت خيوط صغيرة جدًا من الضوء بتقرب بينهم أكتر

استغربت ملك وقالت يعني حتى وإحنا منعرفش بعض كنا قريبين بالشكل ده

فرد عليها الصوت

بعض الأشخاص يبدأون رحلتهم معًا قبل أن يتقابلوا بوقت طويل

وأكمل كلامه

كل موقف علم يحيى معنى معين كان سيحتاجه يومًا ما وكل يوم جعل قلب ملك أقوى كان ينتظر لحظة سيحتاج فيها أن يكون قويًا من أجلها

كل شيء كان يحدث لسبب لم تعرفاه بعد

وفجأة ظهر قدامهم كتاب ضخم جدًا مكتوب عليه

الأشياء التي تغيرت لأنكما التقيتما

فتح يحيى أول صفحة فيه فلقى مكتوب

هناك ألف ضحكة لم تكن لتوجد لو لم تتقابلا

وقلب الصفحة اللي بعدها

هناك ألف يوم كان سيصبح أصعب بكثير لو لم تكونا معًا

والصفحة اللي بعدها

هناك ألف حلم أصبح أجمل لأنه أصبح لشخصين بدلًا من شخص واحد

أما الصفحة الرابعة فكانت مختلفة عن كل الصفحات اللي قبلها

كان مكتوب فيها

هناك نسخة من يحيى لم تكن لتولد لو لم تعرف ملك

وهناك نسخة من ملك لم تكن لتولد لو لم تعرف يحيى

فضلوا ساكتين وقت طويل جدًا وهما بيقروا الجملة دي

يمكن علشان لأول مرة يفكروا قد إيه الإنسان بيتغير لما يقابل الشخص الصح

وكملوا طريقهم لحد ما وصلوا لباب صغير جدًا مكتوب عليه

اليوم الذي دعوتما فيه لبعضكما دون أن تعرفا

استغربوا جدًا وسألوا الصوت عن معناه

فقال

في بعض الأيام تمنى كل منكما وجود شخص يشبه الآخر دون أن يعلم أن ذلك الشخص موجود بالفعل

فتحوا الباب فلقوا نفسهم بيشوفوا لحظات صغيرة جدًا

يحيى بيتمنى يلاقي شخص يفهمه ويطمنه

وملك بتتمنى تلاقي شخص يكون سند ليها

وكل أمنية صغيرة كانت بتتكتب في نور أبيض جميل فوقهم

لحد ما كل الأمنيات الصغيرة دي اتجمعت في نور واحد كبير جدًا

وظهر تحته جملة صغيرة

بعض الأمنيات تتحقق ببطء لكنها عندما تتحقق تجعل كل الانتظار مستحقًا

وفجأة لقوا باب أخير في آخر المكان وكان أجمل باب شافوه من أول الرحلة كلها

كان معمول من كل ألوان المفاتيح اللي شافوها قبل كده وكأن كل الفصول اللي عاشوها كانت مجرد طريق يوصلهم للباب ده

وكان مكتوب عليه

أجمل شيء حدث ولم تنتبها له

فتحوا الباب بهدوء لكنهم متفاجئوش إنهم مشافوش أي حاجة في الأول

لحد ما ظهر قدامهم مرآة صغيرة جدًا

اقتربوا منها فشافوا نفسهم زي ما هما دلوقتي

سأل يحيى باستغراب هو ده المقصود

فرد عليه الصوت

لا انظرا جيدًا

ولأول مرة بدأت المرآة تظهر كل الفصول اللي عاشوها مع بعض

الضحكات والذكريات والكلمات والأحلام والنجوم والمفاتيح والأماكن الجميلة كلها

وبعدها اختفت كل الصور مرة واحدة ولم يتبق فيها غير صورة واحدة فقط

صورة يحيى وهو بيبتسم لما بيبص لملك

وصورة ملك وهي مبتسمة وهي بتبص ليحيى

وظهرت جملة أخيرة في المرآة

أجمل شيء حدث في الحكاية كلها لم يكن المفتاح الأول ولا المكان الأجمل ولا الحلم الأكبر

بل كان أن يجد كل منكما نفسه في عين الآخر

وفي تلك اللحظة لأول مرة حس يحيى إن الرحلة كلها كانت بتحاول تعلمه نفس الدرس من أول يوم

إن الحب الحقيقي مش بيبدأ لما نقول بحبك لكنه بيبدأ لما نحس إن الدنيا بقت أخف لأن الشخص ده موجود فيها

وقبل ما يختفي المكان كله ظهرت آخر جملة في السماء وكانت من أجمل الجمل اللي قروها حتى الآن

لم تكونا تبحثان عن أحلامكما بل كنتما تسيران نحو بعضكما منذ البداية

وبعض الأمنيات الجميلة لا تتحقق لنا بل تتحقق بنا

وبدأ المكان كله يختفي بالتدريج وعاد الصندوق الخشبي مرة أخرى لكن هذه المرة كان المفتاح الجديد مصنوعًا من نور أبيض ناعم جدًا وكان يخرج منه صوت ضحكة صغيرة وكأنه يحمل بداخله أجمل ذكرى لم تحدث بعد

وكان مكتوب عليه

 أول يوم من بقية العمر

وكان تحته جملة صغيرة جدًا

هناك باب لا يريك المستقبل ولا الماضي بل يريك اليوم الذي ستدركان فيه أن الحكاية الحقيقية لم تبدأ بعد

لأول مرة من ساعة ما بدأت رحلة المفاتيح كان يحيى حاسس إن قلبه بيدق أسرع من كل مرة فاتت يمكن علشان اسم المفتاح كان مختلف عن أي اسم قرأه قبل كده

أول يوم من بقية العمر

كانت جملة بسيطة جدًا لكنها خلت عنده ألف سؤال

يعني إيه أول يوم من بقية العمر وهل ممكن يكون الإنسان عايش عمر كامل ولسه مبدأش حكايته الحقيقية

بص لملك وقالها تعرفي إن أكتر حاجة بتخوفني هي إن أجمل أيامنا لسه مجتش

ضحكت وقالتله وليه دي حاجة تخوف

قالها علشان أنا كنت فاكر إني عشت أجمل أيام كتير معاكي فلو اللي جاي أجمل منهم فأنا مش متخيل هيبقى عامل إزاي

ابتسمت وهي باصة ليه وقالتله يمكن أجمل حاجة في الحب إنه كل مرة بيفاجئنا إنه أكبر مما كنا متخيلين

وأول ما مسكوا المفتاح بدأت الدنيا كلها حواليهم تختفي لكن المرة دي مكنش فيه نور ولا موسيقى زي كل مرة

كان فيه هدوء جميل جدًا وكأن الدنيا كلها أخدت نفس عميق معاهم

ولما فتحوا عيونهم متفاجئوش إنهم مشافوش أي مكان جديد

كانوا واقفين في نفس المكان اللي بدأوا منه الرحلة كلها

سماء صافية وهواء هادي وشجرة كبيرة جدًا لكن الغريب إن المكان كان فاضي تمامًا مفيش أي حاجة غير الشجرة دي

سأل يحيى باستغراب هو إحنا رجعنا لأول مكان

فرد عليهم الصوت بابتسامة

بل وصلتما لأول مكان

استغرب أكتر وقال هو مش ده نفس المكان

فرد عليه

هناك فرق كبير بين أن تعود إلى المكان نفسه وأن تصل إليه لأول مرة بقلب مختلف

اقتربوا من الشجرة ولقوا إن أوراقها بيضا تمامًا كأنها مستنية حد يكتب عليها

وكان مكتوب تحتها

هذه الشجرة لا تحمل ذكريات الماضي ولا أحلام المستقبل

بل تحمل الأيام التي ستصنعانها معًا

سألت ملك بابتسامة يعني إحنا اللي هنكتبها

فرد عليها الصوت

لأول مرة منذ بداية الرحلة نعم

وأثناء ما كانوا واقفين ظهرت أول ورقة على الشجرة وكان مكتوب عليها

اليوم الذي ضحكتما فيه حتى بكت أعينكما

ثم ظهرت ورقة تانية

اليوم الذي احتفلتما فيه بشيء كنتما تنتظرانه طويلًا

وثالثة

اليوم الذي احتضن كل منكما الآخر لأنه لم يكن هناك مكان أجمل يريد أن يكون فيه

لكن الغريب إن كل الأوراق دي كانت فاضية من التفاصيل

قال يحيى باستغراب ليه مش شايفين اللي حصل فيها

فرد عليه الصوت

لأن أجمل الأيام لم تعش بعد حتى تكتب

وأكمل كلامه

لقد رأيتما الماضي وعرفتما الحاضر وحلمتما بالمستقبل لكن اليوم هو أول يوم يسمح لكما فيه أن تكتبا حكايتكما بأنفسكما

ولأول مرة لم يظهر أي باب جديد أمامهم

ولا أي اختبار

ولا حتى أي لغز

فقط مكان هادي جدًا وشجرة كبيرة مستنية الأيام اللي لسه مجتش

وبعد وقت طويل من المشي لقوا صندوق صغير جدًا تحت الشجرة

ولما فتحوه لقوا جواه رسالة مكتوبة بخط جميل جدًا

إذا وصلت إلى هنا يا يحيى فأنت تعلم الآن أن أجمل شيء في الحكاية لم يكن الأماكن التي رأيتها بل اليد التي كانت معك وأنت تراها

وإذا وصلت إلى هنا يا ملك فأنت تعلمين الآن أن الحب الحقيقي لا يجعلك سعيدة فقط بل يجعلك أكثر شبهًا بنفسك

أما إذا وصلتما إلى هنا معًا فهناك شيء واحد فقط يجب أن تعرفاه

لم تكن المفاتيح هي التي فتحت الأبواب بل كان حبكما هو الذي يفعل ذلك منذ البداية

فضلوا ساكتين وقت طويل جدًا وهم بيقروا الرسالة

ولأول مرة من ساعة ما بدأت الرحلة حس يحيى إن الصندوق الخشبي كان مجرد حجة جميلة جدًا علشان ياخدهم في رحلة داخل قلوبهم هما الاتنين

وفجأة ظهر باب صغير جدًا في آخر المكان لكنه كان مختلف عن كل الأبواب اللي قبل كده

لأول مرة مكانش عليه اسم

سأل يحيى بابتسامة الباب ده رايح لفين

فرد عليه الصوت

إلى المكان الذي لم يره أحد غيركما

قال باستغراب يعني إيه

فرد عليه

كل قصة حب جميلة في هذا العالم لها مكان خاص بها لا يشبه أي مكان آخر

وهذا المكان لم يولد بعد لأنه ينتظر أن تخلقاه معًا

وأكمل كلامه بهدوء

لقد رأيتما النجوم والأحلام والكلمات والمستقبل لكن هناك شيء واحد لم ترياه بعد

حكايتكما كما ستكتبانها أنتما

سألت ملك بابتسامة وهل للحكاية نهاية

فظل الصوت ساكتًا ثواني طويلة جدًا لأول مرة

ثم قال

لو كانت الحكايات الجميلة تنتهي فعلًا لما استمرت القلوب في تذكرها إلى الأبد

الحكايات لا تنتهي لكنها تتغير فقط

وفي تلك اللحظة بدأت أوراق الشجرة كلها تنور مرة واحدة وظهر عليها كلام لم يكن موجودًا قبل كده

كل يوم ستختاران فيه بعضكما البعض هو أول يوم من بقية العمر

وكل مرة ستنظران فيها لبعضكما بنفس الحب ستكون بداية جديدة للحكاية

وكل ضحكة وكل كلمة وكل حلم صغير سيصبح فصلًا جديدًا لم يكتب بعد

ثم ظهرت آخر جملة في السماء وكانت أجمل جملة قروها منذ بداية رحلتهم

لا تبحثوا عن الأيام الجميلة بل اصنعوها معًا

فبعض الأشخاص يكونون أجمل هدية منحها العمر لنا دون أن نطلبها

وبعض القلوب لا تأتي لتكمل حياتنا فقط بل تأتي لتعلمنا أن الحياة كانت تنتظرها منذ البداية

وبدأ المكان كله يختفي بالتدريج لكن هذه المرة لم يعد الصندوق الخشبي وحده بل عاد ومعه مفتاح جديد لم يكن يشبه أي مفتاح سبق أن رأوه

كان مصنوعًا من ضوء القمر والشمس معًا وكأنه يحمل بداية ونهاية الحكاية في الوقت نفسه

وكان مكتوب عليه

        let targetIdx = 0;

        function initGrid() {
            const grid = document.getElementById('grid');
            chapters.forEach((ch, i) => {
                const b = document.createElement('div');
                b.className = (i === 0) ? 'btn-item btn-intro' : 'btn-item';
                b.innerHTML = `
                    <div class="lock-icon">${i === 0 ? '✨' : '🔒'}</div>
                    <div>${ch.t}</div>
                `;
                b.onclick = () => requestOpenChapter(i);
                grid.appendChild(b);
            });
        }

        // إتاحة فتح مودال كلمة السر لأي فصل (سواء من المنيو أو أزرار التنقل)
        function requestOpenChapter(idx) {
            targetIdx = idx;
            toggleModal(true);
        }

        function toggleModal(show) {
            const m = document.getElementById('pass-modal');
            const inp = document.getElementById('passInput');
            if (show) {
                document.getElementById('modalTitle').innerText = chapters[targetIdx].t;
                m.style.display = 'flex';
                inp.focus();
            } else {
                m.style.display = 'none';
                inp.value = '';
            }
        }

        function checkAuth() {
            const val = document.getElementById('passInput').value;
            const modalBox = document.getElementById('modalBox');

            if (val === chapters[targetIdx].p) {
                openReader(targetIdx);
                toggleModal(false);
            } else {
                // أنيميشن الاهتزاز عند الخطأ
                modalBox.classList.add('shake-err');
                document.getElementById('passInput').style.borderColor = 'red';
                if(window.navigator.vibrate) window.navigator.vibrate(200);

                setTimeout(() => {
                    modalBox.classList.remove('shake-err');
                    document.getElementById('passInput').style.borderColor = '#eee';
                }, 500);
                document.getElementById('passInput').value = '';
            }
        }

        function openReader(idx) {
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('reader-view').style.display = 'flex';
            document.getElementById('chapTitle').innerText = chapters[idx].t;
            document.getElementById('chapContent').innerText = chapters[idx].c;
            
            // تحديث حالة أزرار التالي والسابق
            document.getElementById('prevB').classList.toggle('disabled', idx === 0);
            document.getElementById('nextB').classList.toggle('disabled', idx === chapters.length - 1);
            
            // ارجاع السكرول لأعلى الفصل الجديد
            document.querySelector('.content-scroll').scrollTop = 0;
        }

        function closeReader() {
            document.getElementById('menu-view').style.display = 'block';
            document.getElementById('reader-view').style.display = 'none';
        }

        // عند التصفح بأزرار التالي والسابق يتم طلب كلمة السر الخاصة بالفصل الجديد!
        function triggerNav(step) {
            const nextIdx = targetIdx + step;
            if (nextIdx >= 0 && nextIdx < chapters.length) {
                requestOpenChapter(nextIdx);
            }
        }

        // تشغيل الـ Enter للكيبورد
        document.getElementById('passInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAuth();
        });

        // أنيميشن القلوب
        setInterval(() => {
            const h = document.createElement('div');
            h.className = 'heart';
            h.innerText = ['❤️', '💖', '✨', '🌸'][Math.floor(Math.random()*4)];
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = Math.random() * 20 + 15 + 'px';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 5000);
        }, 500);

        initGrid();
    </script>
