            --p3: #ee9ca7;
            --p4: #ffdde1;
            --deep-pink: #c9184a;
            --glass: rgba(255, 255, 255, 0.2);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow: 0 20px 45px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, var(--p1), var(--p2), var(--p3), var(--p4));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            top: -20px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        /* الكارت الرئيسي */
        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 600px; /* تم تكبير العرض الأقصى للكارت */
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: clamp(30px, 5vw, 50px);
            text-align: center;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .heart {
            font-size: clamp(50px, 10vw, 80px);
            animation: pulse 1.8s infinite;
            display: inline-block;
            margin-bottom: 10px;
            filter: drop-shadow(0 5px 15px rgba(201, 24, 74, 0.3));
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--deep-pink);
            font-size: clamp(2.5rem, 8vw, 4rem);
            margin-bottom: 10px;
        }

        .since-date {
            font-size: clamp(0.7rem, 2vw, 0.85rem);
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #5d5d5d;
            background: rgba(255, 255, 255, 0.45);
            padding: 8px 20px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: clamp(25px, 5vw, 40px);
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* العداد المطور (حل مشكلة الحجم) */
        .timer-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(10px, 2vw, 20px);
            margin-bottom: clamp(30px, 5vw, 45px);
        }

        .time-box {
            background: rgba(255, 255, 255, 0.85);
            padding: clamp(15px, 3vw, 25px) 10px;
            border-radius: 22px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            min-width: clamp(90px, 20vw, 130px); /* ضمان عرض مناسب لكل صندوق */
            flex: 1 1 110px; /* مرونة في التوسع */
            transition: transform 0.3s ease;
            display: none;
        }

        .time-box:hover { transform: translateY(-5px); }

        .num {
            display: block;
            font-size: clamp(1.8rem, 4vw, 2.5rem); /* تكبير الأرقام */
            font-weight: 700;
            color: var(--deep-pink);
            line-height: 1.1;
        }

        .label {
            display: block;
            font-size: clamp(0.65rem, 1.5vw, 0.8rem);
            color: #777;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 8px;
            letter-spacing: 1px;
        }

        /* صندوق الرسالة */
        .message-box {
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            padding: clamp(20px, 4vw, 35px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 2px 15px rgba(0,0,0,0.02);

        #quote {
            font-size: clamp(1rem, 3vw, 1.25rem);
            color: #333;
            font-style: italic;
            line-height: 1.8;
            transition: opacity 0.8s ease;

            position: fixed;
            bottom: clamp(20px, 4vw, 40px);

            color: var(--deep-pink);

            font-size: clamp(0.85rem, 2vw, 1rem);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .next-btn:hover {
            background: var(--deep-pink);
            color: white;
            transform: scale(1.08) translateY(-5px);

        function updateCounter() {
            const now = new Date().getTime();
            let diff = Math.abs(now - targetDate);

            const time = {
                y: Math.floor(diff / (1000 * 60 * 60 * 24 * 365.25)),
                m: Math.floor((diff / (1000 * 60 * 60 * 24 * 30.44)) % 12),
                d: Math.floor((diff / (1000 * 60 * 60 * 24)) % 30.44),
                h: Math.floor((diff / (1000 * 60 * 60)) % 24),
                min: Math.floor((diff / (1000 * 60)) % 60),
                sec: Math.floor((diff / 1000) % 60)
            };

            for (const key in time) {
                const numEl = document.getElementById(key);
                const boxEl = document.getElementById('b-' + key);
                if(numEl) numEl.innerText = time[key];
                
                if (time[key] > 0 || key === 'sec' || key === 'min') {
                    if(boxEl) boxEl.style.display = 'block';
                } else {
                    if(boxEl) boxEl.style.display = 'none';
                }
            }
        }

        function updateHourlyMessage() {
            // استخدام عدد الساعات منذ Epoch لضمان تغير الرسالة كل ساعة وعدم التكرار
            const hoursSinceEpoch = Math.floor(Date.now() / (1000 * 60 * 60));
            const index = hoursSinceEpoch % messages.length;
            
            const quoteEl = document.getElementById("quote");
            quoteEl.style.opacity = 0;
            
            setTimeout(() => {
                quoteEl.innerText = `"${messages[index]}"`;
                quoteEl.style.opacity = 1;
            }, 800);
        }

        function createParticle() {
            const symbols = ['❤️', '✨', '🌸', '💖', '🤍'];
            const p = document.createElement('div');
            p.classList.add('particle');
            p.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            p.style.left = Math.random() * 100 + 'vw';
            p.style.fontSize = (Math.random() * 15 + 10) + 'px';
            p.style.animationDuration = (Math.random() * 3 + 4) + 's';
            p.style.opacity = Math.random() * 0.4 + 0.3;
            document.getElementById('particles').appendChild(p);
            setTimeout(() => p.remove(), 7000);
        }

        setInterval(updateCounter, 1000);
        setInterval(createParticle, 600);
        
        // التحقق كل دقيقة من دخول ساعة جديدة
        setInterval(() => {
            const now = new Date();
            if (now.getMinutes() === 0) updateHourlyMessage();
        }, 60000);

        updateCounter();
        updateHourlyMessage();
