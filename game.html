        :root {
            --primary: #ff758f;

        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: var(--bg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: none; 
        }

        #ui-bar {
            position: absolute;
            top: 25px;
            width: 85%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            padding: 15px 25px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.4);
            color: #b91d47;
            font-weight: 600;
        }

        #player {
            position: absolute;
            bottom: 60px;
            width: 75px;
            height: 75px;
            font-size: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .falling-heart {
            position: absolute;
            font-size: 28px;
            z-index: 40;
        }

        /* شاشة النتائج */
        #results-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 245, 247, 0.98);
            display: none; /* مخفية في البداية */
            flex-direction: column;
            align-items: center;
            z-index: 200;
            padding: 30px 15px;
            touch-action: auto !important; 
            overflow-y: auto;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 420px;
            border-radius: 35px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid #ffe5ec;
            margin-bottom: 20px;
        }

        .card h2 { font-family: 'Dancing Script', cursive; font-size: 2.8rem; color: #ff4d6d; }
        
        .msg-list {
            margin-top: 20px;
            max-height: 40vh;
            overflow-y: auto;
            padding: 10px;
            -webkit-overflow-scrolling: touch; 
            touch-action: pan-y !important; 
        }

        .msg-bubble {
            background: #fff5f8;
            margin-bottom: 12px;
            padding: 15px;
            border-radius: 20px;
            font-size: 0.95rem;
            color: #555;
            text-align: left;
            border-left: 5px solid #ff758f;
            animation: popIn 0.5s ease forwards;
            opacity: 0;
        }

        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .btn {
            padding: 16px; background: #ff758f; color: white;
            border: none; border-radius: 20px; font-weight: 700;
            margin-top: 15px; width: 100%; cursor: pointer;
            font-size: 1rem; display: block; text-decoration: none;
        }

        /* تنسيق زرار العودة للقائمة */
        .btn-back {
            background: #fff;
            color: #ff758f;
            border: 2px solid #ff758f;
        }

        #intro-hint {
            position: absolute; top: 50%; color: #d63384; 
            font-weight: 500; text-align: center; width: 100%;
            font-size: 1.1rem; opacity: 0.8;
        }
    </style>

        function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

        function start() {
            if (started) return;
            started = true;
            active = true;
            hint.style.display = 'none';
            const timer = setInterval(() => {
                timeLeft--;
                timerEl.textContent = `Time: ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    end();
                }
            }, 1000);
        }

        const move = (e) => {
            if (timeLeft <= 0) return;
            start();
            let x = (e.touches ? e.touches[0].clientX : e.clientX) - player.offsetWidth / 2;
            if (x < 0) x = 0;
            if (x > window.innerWidth - player.offsetWidth) x = window.innerWidth - player.offsetWidth;
            player.style.left = x + 'px';
        };

        document.addEventListener('touchmove', move, { passive: false });
        document.addEventListener('mousemove', move);

        function spawn() {
            if (!active) return;
            const h = document.createElement('div');
            h.className = 'falling-heart';
            h.textContent = ['❤️', '💖', '💕', '✨', '🌸'][Math.floor(Math.random() * 5)];
            h.style.left = Math.random() * (window.innerWidth - 40) + 'px';
            h.style.top = '-50px';
            document.body.appendChild(h);

            let top = -50;
            let speed = 2.5 + Math.random() * 1.5;

            const fall = setInterval(() => {
                top += speed;
                h.style.top = top + 'px';
                const pRect = player.getBoundingClientRect();
                const hRect = h.getBoundingClientRect();

                if (hRect.bottom >= pRect.top + 15 && hRect.left >= pRect.left - 10 && hRect.right <= pRect.right + 10) {
                    score++;
                    scoreEl.textContent = score;
                    h.remove();
                    clearInterval(fall);
                }
                if (top > window.innerHeight || !active) {
                    h.remove();
                    clearInterval(fall);
                }
            }, 20);
        }

        function end() {
            active = false;
            document.body.style.touchAction = "auto";
            document.body.style.overflow = "auto";

            // إظهار شاشة النتائج (التي تحتوي على زر العودة)
            resultsEl.style.display = 'flex';

            document.getElementById('total-text').textContent = `You gathered ${score} hearts!`;
            const sessionMessages = shuffle([...messages]).slice(0, score);

            sessionMessages.forEach((m, i) => {
                setTimeout(() => {
                    const div = document.createElement('div');
                    div.className = 'msg-bubble';
                    div.textContent = `🌸 ${m}`;
                    listEl.appendChild(div);
                    listEl.scrollTop = listEl.scrollHeight;
                }, i * 350);
            });
        }

        setInterval(spawn, 900);
    </script>
