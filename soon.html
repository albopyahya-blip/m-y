<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4d6d;
            --accent: #d63384;
            --bg-grad: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            --glass: rgba(255, 255, 255, 0.28);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-grad);
            overflow: hidden;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: clamp(40px, 10vw, 60px);
            border-radius: 35px;
            box-shadow: 0 20px 45px rgba(255, 77, 109, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(3rem, 15vw, 5rem);
            color: var(--accent);
            margin-bottom: 10px;
            text-align: center;
        }

        p {
            font-size: 1.1rem;
            color: #4a4a4a;
            font-weight: 500;
            margin-bottom: 30px;
            text-align: center;
        }

        .main-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 20px;
            background: var(--primary);
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.4);
            text-align: center;
        }

        /* أنميشن اللمعان التلقائي */
        .main-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite linear;
        }

        @keyframes shimmer {
            0% { transform: translateX(-150%) rotate(45deg); }
            100% { transform: translateX(150%) rotate(45deg); }
        }

        .heart {
            position: fixed; bottom: -50px; pointer-events: none;
            animation: floatUp linear forwards; z-index: 1;
        }
        @keyframes floatUp { to { transform: translateY(-115vh) rotate(360deg); opacity: 0; } }

    </style>
</head>
<body>

    <div class="card">
        <h1>Soon</h1>
        <p>Something beautiful is coming for you ❤️</p>
        
        <!-- زر العودة يستدعي وظيفة الرجوع في تاريخ المتصفح -->
        <div class="main-btn" onclick="history.back()">Back</div>
    </div>

    <script>
        function createHeart() {
            const h = document.createElement('div');
            h.className = 'heart';
            h.textContent = ['❤️','💖','🌸','✨','💕'][Math.floor(Math.random()*5)];
            h.style.left = Math.random() * 100 + "vw";
            h.style.fontSize = (20 + Math.random()*25) + "px";
            h.style.animationDuration = (4 + Math.random()*3) + "s";
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 7000);
        }

        setInterval(createHeart, 450);
    </script>
</body>
</html>
