<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Royal Document 📜</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4d6d;
            --bg-grad: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            --glass: rgba(255, 255, 255, 0.28);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: var(--bg-grad); overflow: hidden; padding: 15px;
        }

        .container {
            width: 100%; max-width: 600px;
            background: var(--glass); backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 35px 20px; border-radius: 35px;
            box-shadow: 0 20px 45px rgba(255, 77, 109, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center; z-index: 10;
        }

        h1 { font-family: 'Dancing Script', cursive; color: white; font-size: 2.8rem; margin-bottom: 25px; }

        /* أيقونة الـ PDF */
        .pdf-icon { font-size: 60px; margin-bottom: 20px; display: block; }

        .btn-stack { display: flex; flex-direction: column; gap: 15px; }

        .btn {
            padding: 16px; border-radius: 20px; border: none;
            font-weight: 700; text-decoration: none; font-size: 1rem;
            transition: 0.3s; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        /* زر التحميل */
        .btn-download {
            background: var(--primary); color: white;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
        }

        /* زر المعاينة */
        .btn-view { background: white; color: var(--primary); }

        /* زر الرجوع */
        .btn-back { background: transparent; color: #666; font-size: 0.8rem; text-decoration: underline; }

        .btn:active { transform: scale(0.95); }

        /* قلوب */
        .heart { position: fixed; bottom: -50px; pointer-events: none; animation: floatUp linear forwards; z-index: 1; }
        @keyframes floatUp { to { transform: translateY(-115vh) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>

    <div class="container">
        <span class="pdf-icon">❤️</span>
        <h1>Special Letter</h1>
        <p style="color: #4a4a4a; margin-bottom: 30px; font-size: 0.9rem;">I have prepared a special document just for you</p>
        
        <div class="btn-stack">
            <!-- زر التحميل - كلمة download تجبر المتصفح على تحميل الملف -->
            <a href="maloktyy.pdf" download="For_My_Queen.pdf" class="btn btn-download">
                📥 Download PDF
            </a>

            <!-- زر المعاينة (يفتح الملف في صفحة جديدة) -->
            <a href="maloktyy.pdf" target="_blank" class="btn btn-view">
                👁️ View Online
            </a>

            <a href="heart.html" class="btn-back">Back</a>
        </div>
    </div>

    <script>
        function createHeart() {
            const h = document.createElement('div');
            h.className = 'heart';
            h.textContent = ['❤️','💖','🌸','✨','💕'][Math.floor(Math.random()*5)];
            h.style.left = Math.random() * 100 + "vw";
            h.style.fontSize = (20 + Math.random()*20) + "px";
            h.style.animationDuration = (4 + Math.random()*3) + "s";
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 7000);
        }
        setInterval(createHeart, 450);
    </script>
</body>
</html>
