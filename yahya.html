<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love</title>
    <!-- Bold Meme Font -->
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-stroke: #000;
            --love-pink: #ff4d6d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Luckiest Guy', cursive;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        /* Container for the text */
        .text-wrapper {
            text-align: center;
            perspective: 1000px;
        }

        .animated-text {
            font-size: clamp(4rem, 15vw, 8rem);
            color: #fff;
            -webkit-text-stroke: 3px var(--text-stroke);
            text-shadow: 8px 8px 0px var(--text-stroke);
            letter-spacing: 4px;
            opacity: 0;
            display: none;
            line-height: 1;
        }

        /* Animations for different stages */
        @keyframes popIn {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            70% { transform: scale(1.3) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0) scale(1.1); }
            25% { transform: translateX(-10px) rotate(-2deg) scale(1.1); }
            75% { transform: translateX(10px) rotate(2deg) scale(1.1); }
        }

        .active-text {
            display: block;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Final Stage Effect */
        .final-stage {
            animation: popIn 0.5s forwards, shake 0.2s infinite 0.5s;
            color: var(--love-pink) !important;
        }

        /* Start Button Screen */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .start-btn {
            background: var(--love-pink);
            color: white;
            padding: 20px 60px;
            border-radius: 50px;
            font-size: 2rem;
            border: 4px solid #000;
            box-shadow: 8px 8px 0 #000;
            transition: transform 0.1s;
        }

        .start-btn:active { transform: translate(4px, 4px); box-shadow: 4px 4px 0 #000; }

        /* Heart Particles */
        .heart {
            position: absolute;
            pointer-events: none;
            z-index: -1;
            animation: burst 1.5s ease-out forwards;
        }

        @keyframes burst {
            0% { transform: translate(0, 0) scale(0); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(2); opacity: 0; }
        }

        .nav-back {
            position: fixed;
            bottom: 20px;
            text-decoration: none;
            color: #000;
            font-weight: bold;
            opacity: 0.2;
            font-family: sans-serif;
            text-transform: uppercase;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="startKineticShow()">
        <div class="start-btn">TAP TO OPEN</div>
    </div>

    <div class="text-wrapper">
        <h1 id="txt1" class="animated-text">I </h1>
        <h1 id="txt2" class="animated-text">LOVE</h1>
        <h1 id="txt3" class="animated-text">YOUUU!!!</h1>
    </div>

    <a href="heart.html" class="nav-back">Back</a>

    <script>
        function startKineticShow() {
            document.getElementById('overlay').style.display = 'none';
            
            const t1 = document.getElementById('txt1');
            const t2 = document.getElementById('txt2');
            const t3 = document.getElementById('txt3');

            // Stage 1
            setTimeout(() => {
                showText(t1);
            }, 500);

            // Stage 2
            setTimeout(() => {
                showText(t2);
            }, 1800);

            // Stage 3: YOUUU
            setTimeout(() => {
                showText(t3, true);
                startParticleShower();
                document.body.style.backgroundColor = "#fff0f3"; // Soft pink bg change
            }, 3200);
        }

        function showText(el, isFinal = false) {
            // Hide all
            document.querySelectorAll('.animated-text').forEach(t => {
                t.classList.remove('active-text', 'final-stage');
                t.style.display = 'none';
            });

            // Show current
            el.style.display = 'block';
            if (isFinal) {
                el.classList.add('final-stage');
            } else {
                el.classList.add('active-text');
            }
        }

        function startParticleShower() {
            for (let i = 0; i < 50; i++) {
                setTimeout(createHeart, i * 30);
            }
        }

        function createHeart() {
            const h = document.createElement('div');
            h.className = 'heart';
            h.innerHTML = ['❤️','💖','💕','💗','✨'][Math.floor(Math.random()*5)];
            h.style.left = '50%';
            h.style.top = '50%';
            h.style.fontSize = (Math.random() * 40 + 20) + 'px';
            
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 500 + 200;
            h.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
            h.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
            
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 1500);
        }
    </script>
</body>
</html>
